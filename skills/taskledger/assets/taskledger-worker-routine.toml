and obtain a fresh current receipt. Attach receipt IDs to `worker submit`.
Register only intentional evidence artifacts. Do not repeatedly run the complete
required suite merely as a progress probe.
Do not create the submission commit yourself. Stop after submitting.

Never modify the canonical worktree or verify, integrate, plan, resolve blockers,
verify requirements, or complete the project.
"""
