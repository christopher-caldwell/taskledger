[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskledger"
version = "0.6.0"
description = "Local durable execution ledger"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"

[project.scripts]
taskledger = "taskledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
