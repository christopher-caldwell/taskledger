[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskledger"
version = "0.6.0"
description = "Local durable execution ledger"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"

[project.scripts]
taskledger = "taskledger.cli:main"
taskledger-worker-proxy = "taskledger.worker_proxy:main"

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskledger = ["ui/*.tcss", "assets/*.toml"]
